name: PR Validation

on:
  pull_request:
    branches: [ main ]
    types: [ opened, reopened, synchronize, ready_for_review ]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changed Stacks
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      flutter: ${{ steps.filter.outputs.flutter }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            dotnet:
              - '**/*.sln'
              - '**/*.csproj'
              - '**/*.fsproj'
              - '**/*.cs'
            flutter:
              - '**/*.dart'
              - '**/pubspec.yaml'
              - '**/pubspec.lock'
            python:
              - '**/*.py'
              - 'requirements.txt'

  dotnet:
    name: .NET Build & Test
    needs: detect-changes
    if: needs.detect-changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          if ls **/*.sln 1> /dev/null 2>&1; then
            dotnet restore $(ls **/*.sln | head -n 1)
          else
            for proj in $(ls **/*.csproj **/*.fsproj 2>/dev/null || true); do dotnet restore "$proj"; done
          fi

      - name: Build (Release)
        run: |
          if ls **/*.sln 1> /dev/null 2>&1; then
            dotnet build $(ls **/*.sln | head -n 1) --configuration Release --no-restore
          else
            for proj in $(ls **/*.csproj **/*.fsproj 2>/dev/null || true); do dotnet build "$proj" --configuration Release --no-restore; done
          fi

      - name: Test (if tests exist)
        run: |
          set -e
          if ls **/*Tests.csproj **/*.Tests.csproj **/*Test.csproj 1> /dev/null 2>&1; then
            for testproj in $(ls **/*Tests.csproj **/*.Tests.csproj **/*Test.csproj 2>/dev/null || true); do dotnet test "$testproj" --configuration Release --no-build --logger "trx;LogFileName=test_results.trx"; done
          else
            echo "No .NET test projects detected. Skipping tests."
          fi

  flutter:
    name: Flutter Analyze & Test
    needs: detect-changes
    if: needs.detect-changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter pub get (if pubspec exists)
        run: |
          set -e
          if ls **/pubspec.yaml 1> /dev/null 2>&1; then
            for f in $(ls -d **/ | grep -E ".*" ); do
              if [ -f "$f/pubspec.yaml" ]; then
                (cd "$f" && flutter pub get)
              fi
            done
          else
            echo "No pubspec.yaml found. Skipping pub get."
          fi

      - name: Analyze Dart
        run: |
          if ls **/*.dart 1> /dev/null 2>&1; then
            flutter analyze
          else
            echo "No Dart files found. Skipping analyze."
          fi

      - name: Run Flutter tests (if present)
        run: |
          if ls **/test/*.dart 1> /dev/null 2>&1; then
            flutter test --machine | tee flutter-tests.json
          else
            echo "No Flutter tests found. Skipping."
          fi

  python:
    name: Python Lint & Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install ruff pytest

      - name: Ruff lint (non-blocking)
        continue-on-error: true
        run: ruff check .

      - name: Run pytest if tests present
        run: |
          if [ -d tests ] || ls **/tests 1> /dev/null 2>&1; then
            pytest -q || pytest -q -k "not slow"
          else
            echo "No pytest tests found. Skipping."
          fi


