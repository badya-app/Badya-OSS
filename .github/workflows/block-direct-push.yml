name: Block Direct Pushes to Main

on:
  push:
    branches: [ main ]

jobs:
  block-direct-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check if commit is associated with a PR
        id: check_pr
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Check if this commit SHA is associated with any PRs
          RESP=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
                       -H "Accept: application/vnd.github.groot-preview+json" \
                       "https://api.github.com/repos/$REPO/commits/$SHA/pulls")
          COUNT=$(echo "$RESP" | jq 'length')
          if [ "${COUNT}" -gt 0 ]; then
            echo "is_pr_commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_pr_commit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Block direct push with clear error
        if: steps.check_pr.outputs.is_pr_commit == 'false' && github.actor != 'web-flow' && github.actor != 'github-actions[bot]' && github.actor != 'mohamed-717-os'
        run: |
          echo "❌ DIRECT PUSH TO MAIN BLOCKED ❌"
          echo "=========================================="
          echo "Team Policy Violation: Direct pushes to main are not allowed."
          echo ""
          echo "📋 CORRECT WORKFLOW:"
          echo "1. git checkout -b feature/your-feature-name"
          echo "2. Make your changes and commit"
          echo "3. git push origin feature/your-feature-name" 
          echo "4. Create Pull Request on GitHub"
          echo "5. Get code review approval"
          echo "6. Merge via PR"
          echo ""
          echo "⚠️  This build will fail intentionally to enforce code review process."
          exit 1