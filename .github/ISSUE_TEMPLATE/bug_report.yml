name: 🐛 Bug Report
description: File a bug report to help us improve Badya.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Badya is affected?
      options:
        - Flutter App (Frontend)
        - AI Backend (FastAPI / ADK)
        - Story Weaver (story_agent)
        - Word Smith (word_smith_agent / SRS)
        - Role Master (role_master_agent)
        - Echo Chamber (video_agent / voice)
        - Content Importer (importer)
        - Firebase Integration
        - CI / GitHub Actions
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please complete the following information.
      value: |
        - OS: [e.g. macOS 14, Ubuntu 22.04, Windows 11]
        - Flutter version: [e.g. 3.22.0]
        - Python version: [e.g. 3.11.9]
        - Device / Emulator: [e.g. Pixel 7, iOS Simulator 17.5]
        - Badya version / commit: [e.g. v1.2.2 or abc1234]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Stack Traces
      description: Paste any relevant logs, stack traces, or error messages here. This will be automatically formatted as code.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or screen recordings about the problem here.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I have NOT included any real API keys, credentials, or personal data in this report.
          required: true
