name: 🚀 Feature Request
description: Suggest a new feature or enhancement for Badya.
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please fill out this form as thoroughly as you can.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: Is your feature request related to a problem? Please describe it clearly.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Relevant Component
      description: Which part of Badya would this feature affect?
      options:
        - Flutter App (Frontend)
        - AI Backend (FastAPI / ADK)
        - Story Weaver (story_agent)
        - Word Smith (word_smith_agent / SRS)
        - Role Master (role_master_agent)
        - Echo Chamber (video_agent / voice)
        - Content Importer (importer)
        - Firebase Integration
        - CI / GitHub Actions
        - Documentation
        - New Component / Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I am willing to contribute a PR for this feature.
